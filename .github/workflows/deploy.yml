name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_ASSET_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Verify Pages base and baked asset URLs
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          ASSET_HOST: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          test -f dist/index.html
          grep -q "/${REPO_NAME}/" dist/index.html
          grep -rq "${ASSET_HOST}" dist/assets/*.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4